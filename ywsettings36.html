        <style>
            #submit-bar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 1000;
                padding: 8px 16px;
                background-color: #2b3e50;
                border-bottom: 1px solid #1a252f;
                text-align: center;
            }
            body { padding-top: 52px; }

            /* Remove accordion — show everything expanded, hide the toggle headers */
            .panel-heading { display: none; }
            .panel-collapse { display: block !important; height: auto !important; overflow: visible !important; }

            /* Toggle buttons: dark/muted when off, bright green + checkmark when on */
            .btn-group[data-toggle="buttons"] .btn {
                background-color: #1a252f;
                border-color: #4a6070;
                color: #7a8fa0;
                font-weight: normal;
                box-shadow: none;
                transition: background-color 0.1s, color 0.1s;
            }
            .btn-group[data-toggle="buttons"] .btn:hover {
                background-color: #253545;
                color: #aabbc8;
            }
            .btn-group[data-toggle="buttons"] .btn.active,
            .btn-group[data-toggle="buttons"] .btn:active {
                background-color: #27ae60;
                border-color: #1e8449;
                color: #ffffff;
                font-weight: bold;
                box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
            }
            .btn-group[data-toggle="buttons"] .btn.active::before {
                content: "\2713\00a0";  /* ✓ + non-breaking space */
            }
        </style>

                function getQueryVariable(variable) {
                    var query = location.search.substring(1);
                    var vars = query.split('&');
                    for (var i = 0; i < vars.length; i++) {
                        var pair = vars[i].split('=');
                        if (pair[0] == variable)
                            return decodeURIComponent(pair[1]);
                    }
                    return "";
                }
